<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - MelodySphere</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="theme-color" content="#0f0c29">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        .offline-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 24px;
            padding: 40px 30px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(16px);
        }
        .offline-icon {
            font-size: 54px;
            color: #00f2fe;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 16px rgba(0, 242, 254, 0.6));
        }
        h1 { font-size: 24px; font-weight: 700; margin-bottom: 10px; }
        p { color: rgba(255, 255, 255, 0.65); font-size: 14px; margin-bottom: 25px; line-height: 1.5; }
        .retry-btn {
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            border: none;
            padding: 12px 28px;
            border-radius: 25px;
            color: #030811;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .retry-btn:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(0, 242, 254, 0.6); }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="offline-icon"><i class="fas fa-wifi-slash"></i></div>
        <h1>You are Offline</h1>
        <p>Please check your internet connection and try again to discover and stream unlimited music.</p>
        <button class="retry-btn" onclick="window.location.reload()"><i class="fas fa-redo"></i> Retry Connection</button>
    </div>
</body>
</html>
